name: Schedule Discussion Post Action
description:
  This action will create a discussion post in a repository at a scheduled time.
author: Ben Balter
runs:
  using: node20
  main: dist/index.js
inputs:
  repo_token:
    description: The default GitHub Actions token
    required: false
    default: ${{ github.token }}
  discussion_token:
    description: A PAT with `discussion:write` scope for the target repository
    required: false
  files:
    description:
      A JSON-encoded list of paths to process, otherwise all `*.md` files in the
      repository will be processed
    required: false
    default: ''
  drafts_dir:
    description:
      The directory to search for draft markdown files. Supports subdirectories.
      Defaults to the repository root.
    required: false
    default: './'
  dry_run:
    description: Whether to actually create the post
    required: false
    default: 'false'
outputs:
  published_count:
    description: The number of discussion posts that were published
  skipped_count:
    description:
      The number of drafts that were skipped (future, already published, or
      invalid)
  published_urls:
    description: A JSON array of URLs for the published discussion posts
