name: Lint drafts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-drafts:
    runs-on: ubuntu-latest
    name: Lint changed drafts
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get all changed markdown files
        id: changed-markdown-files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" \
            -- '*.md' ':(exclude)__tests__/**' | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "all_changed_files=${files}" >> "$GITHUB_OUTPUT"
          if [ "${files}" = "[]" ]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # dist/ isn't committed to main (script/release builds it for tags), so
      # build the bundle that `uses: ./` runs.
      - name: Setup Node.js
        if: steps.changed-markdown-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        if: steps.changed-markdown-files.outputs.any_changed == 'true'
        run: npm ci --ignore-scripts

      - name: Build dist/
        if: steps.changed-markdown-files.outputs.any_changed == 'true'
        run: npm run package

      - name: Lint markdown files
        uses: ./ # zizmor: ignore[self-repository]
        if: steps.changed-markdown-files.outputs.any_changed == 'true'
        with:
          dry_run: true
          files: ${{ steps.changed-markdown-files.outputs.all_changed_files }}
